apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clawdbot-carryall.fullname" . }}-secrets
  labels:
    {{- include "clawdbot-carryall.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.carryallRootKey }}
  carryall-root-key: {{ .Values.secrets.carryallRootKey | b64enc | quote }}
  {{- end }}
  gateway-token: {{ default (randAlphaNum 32) .Values.secrets.gatewayToken | b64enc | quote }}
