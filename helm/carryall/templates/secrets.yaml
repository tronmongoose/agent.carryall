{{- if or .Values.secrets.openaiApiKey .Values.secrets.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carryall.fullname" . }}-secrets
  labels:
    {{- include "carryall.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
{{- end }}
